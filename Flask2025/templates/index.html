<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Todo App</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2 class="my-3">Add Todos</h2>
    <form method="POST">
        <div class="form-group">
            <label for="title">To Do Title</label>
            <input type="text" id="title" name="title" class="form-control" required>

            <label for="desc">To Do Description</label>
            <input type="text" id="desc" name="desc" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <div class="container my-5">
        <h2>Your Todos</h2>
        <table class="table">
            <thead>
            <tr>
                <th>SNO</th>
                <th>Title</th>
                <th>Description</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            {% for todo in allTodos %}
                <tr>
                    <th scope="row">{{ loop.index }}</th>
                    <td>{{ todo.title }}</td>
                    <td>{{ todo.desc }}</td>
                    <td>{{ todo.date_created.strftime('%Y-%m-%d %H:%M') }}</td>
                    <td>
                        <a href="/update/{{todo.sno}}" class="btn btn-sm btn-warning">Update</a>
                        <a href="/delete/{{todo.sno}}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
            {% else %}
                <tr>
                    <td colspan="5">No Todos Found</td>
                </tr>
            {%endfor%}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
